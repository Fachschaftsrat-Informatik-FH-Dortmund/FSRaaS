apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'
apply plugin: 'realm-android'
apply plugin: "androidx.navigation.safeargs"
apply plugin: 'dagger.hilt.android.plugin'

android {
    namespace "de.fsrfb4.fb4"
    compileSdkVersion 35

    defaultConfig {
        applicationId "de.fsrfb4.fb4"
        minSdkVersion 26
        targetSdkVersion 35
        multiDexEnabled true

        versionCode 58
        versionName "1.4.11"
    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        error 'HardcodedText'
        ignore 'InvalidPackage'
        warning 'StaticFieldLeak'
    }
}

configurations {
    implementation.exclude group: 'stax'
    implementation.exclude group: 'xpp3'
}

dependencies {
    compileOnly 'org.projectlombok:lombok:1.18.42'
    annotationProcessor "org.projectlombok:lombok:1.18.42"
    implementation "androidx.room:room-runtime:2.6.1"
    annotationProcessor "androidx.room:room-compiler:2.6.1"
    implementation "androidx.room:room-guava:2.6.1"
    implementation 'androidx.lifecycle:lifecycle-livedata:2.6.2'
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'me.zhanghai.android.materialprogressbar:library:1.3.0'
    implementation 'com.github.afollestad.material-dialogs:core:0.9.1.0@aar'
    implementation 'com.github.afollestad.material-dialogs:commons:0.9.1.0@aar'
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'org.jsoup:jsoup:1.15.3'
    implementation fileTree(include: ['*.aar'], dir: 'libs')
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.legacy:legacy-preference-v14:1.0.0'
    implementation 'androidx.fragment:fragment:1.8.9'
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.retrofit2:converter-scalars:2.11.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.navigation:navigation-fragment:2.7.7'
    implementation 'androidx.navigation:navigation-ui:2.7.7'
    implementation 'com.wdullaer:materialdatetimepicker:2.5.0'
    implementation 'io.freefair:slf4j-android:1.7.21'
    implementation 'com.google.firebase:firebase-messaging'
    testImplementation 'junit:junit:4.12'
    testImplementation 'org.assertj:assertj-core:2.6.0'
    implementation 'com.github.castorflex.smoothprogressbar:library-circular:1.3.0'
    implementation 'com.github.Ferfalk:SimpleSearchView:0.1.4'
    implementation "androidx.work:work-runtime:2.9.0"
    implementation "androidx.concurrent:concurrent-futures:1.3.0"
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation "com.github.permissions-dispatcher:permissionsdispatcher:4.9.1"
    implementation "com.squareup.okhttp3:okhttp-urlconnection:3.14.9"
    annotationProcessor "com.github.permissions-dispatcher:permissionsdispatcher-processor:4.9.1"
    implementation "com.google.dagger:hilt-android:2.51.1"
    annotationProcessor "com.google.dagger:hilt-compiler:2.51.1"
}