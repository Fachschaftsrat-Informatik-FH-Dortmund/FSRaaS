# nginx-Reverse-Proxy für das fsrfb4aas-Backend.
#
#   sudo cp nginx-fsrfb4aas.conf /etc/nginx/sites-available/api.fb4.it
#   sudo ln -s /etc/nginx/sites-available/api.fb4.it /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.fb4.it      # ergänzt die ssl_*-Zeilen + Port-80-Weiterleitung
#
# Kestrel lauscht nur auf 127.0.0.1:5100 (siehe fsrfb4aas.service). TLS terminiert hier.

server {
    listen 80;
    listen [::]:80;
    server_name api.fb4.it;

    # Vor certbot: direkt bedienen. Nach certbot: 301 auf https (von certbot gesetzt).
    location / {
        proxy_pass         http://127.0.0.1:5100;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        keep-alive;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # Health-Check ohne Zugriffsprotokoll (API-N-090 / API-F-260).
    location = /health {
        proxy_pass http://127.0.0.1:5100/health;
        access_log off;
    }

    # Verwaltungsoberfläche (ADR 0018): unter /admin, Assets mit /admin-Präfix
    # (app.json experiments.baseUrl). Der Aufruf ohne Schrägstrich braucht die
    # Umleitung, sonst greift das Default-File-Handling im Backend nicht.
    location = /admin {
        return 308 /admin/;
    }

    client_max_body_size 10m;
}
