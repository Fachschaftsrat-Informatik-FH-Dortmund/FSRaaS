openapi: 3.1.0

# Vertrag des eigenen Backends (INT-008).
#
# Diese Datei ist Teil des Spec-Bestands und unterliegt denselben Änderungsregeln
# wie jede Spec (README.md Abschnitt 8). Eine Vertragsänderung ist eine Spec-Änderung.
# Grundlage: decisions/0011-monorepo-und-openapi-vertrag.md.
#
# Umfang dieser Fassung: die erste Ausbaustufe (decisions/0012). Endpunkte der zweiten
# Ausbaustufe (Events, Helferbedarf, E-Key, Prüfungsplan, Moderation, Push) werden
# ergänzt, sobald die jeweils blockierende Klärung vorliegt.

info:
  title: FB4-App Backend
  # Dokumentversion dieser Datei nach specs/README.md Abschnitt 8 (Spec-Versionierung) —
  # unabhängig vom Wire-Versionssegment /v1 in der Server-URL unten. Ein Anstieg hier
  # begleitet jede inhaltliche Änderung dieses Vertrags; /v1 ändert sich nur bei einer
  # brechenden Schnittstellenänderung. Siehe decisions/0016-api-versionierung-und-deprecation.md.
  version: 0.5.1
  description: |
    Schreibpfade, Zwischenspeicher und Stammdaten der FB4-App.
    Aufgabenschnitt und Prinzipien: specs/platform/backend-and-api.md.
    Externe Quellsysteme: specs/platform/integrations.md.
  license:
    name: MIT
    identifier: MIT

servers:
  # Produktive Domain 2026-09-03 auf api.fb4.it festgelegt (Wildcard-DNS *.fb4.it
  # auf den Hetzner-VPS). Reverse-Proxy und Auslieferung: deploy/ im Repo.
  - url: https://api.fb4.it/v1
    description: Produktivbetrieb (Hetzner-VPS, FSR FB4)

tags:
  - name: mensa
    description: Speiseplan und Mensa-Stammdaten (MENSA, INT-015)
  - name: raum
    description: Raumsuche, Raumtermine und Besetzt-Meldungen (RAUM, INT-009)
  - name: news
    description: Meldungen und Redaktion (NEWS, ADMIN, INT-003/INT-010)
  - name: stundenplan
    description: Rückfalldaten für den Stundenplan (SCHED, INT-001)
  - name: bewertung
    description: Mensa-Bewertungen (RATE)
  - name: stammdaten
    description: Ferngepflegte Stammdaten (API-F-230)
  - name: verwaltung
    description: Rollen und Protokoll (ADMIN)

security:
  - authentik: []

paths:
  # ---------------------------------------------------------------- Stammdaten
  /stammdaten:
    get:
      tags: [stammdaten]
      summary: Alle ferngepflegten Stammdaten in einem Aufruf
      description: |
        Erfüllt API-F-230. Die App hält das Ergebnis lokal vor (DATA, Abschnitt 4) und
        fällt bei Nichterreichbarkeit auf den im Anwendungspaket mitgelieferten
        Ausgangsbestand zurück (API-F-235).
      security: []
      responses:
        "200":
          description: Stammdatenbestand
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stammdaten" }
        default: { $ref: "#/components/responses/Fehler" }

  # --------------------------------------------------------------------- Mensa
  /mensen:
    get:
      tags: [mensa]
      summary: Auswählbare Mensen
      description: Erfüllt API-F-230 für MENSA-F-020; Öffnungszeiten gemäß MENSA-F-047.
      security: []
      responses:
        "200":
          description: Liste der Mensen
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Mensa" }
        default: { $ref: "#/components/responses/Fehler" }

  /mensen/{mensaId}/speiseplan/{datum}:
    get:
      tags: [mensa]
      summary: Speiseplan einer Mensa für einen Tag
      description: Zwischenspeicher von INT-015, erfüllt API-F-070.
      security: []
      parameters:
        - $ref: "#/components/parameters/MensaId"
        - $ref: "#/components/parameters/Datum"
        - $ref: "#/components/parameters/Sprache"
      responses:
        "200":
          description: Gerichte des Tages; leere Liste bedeutet „kein Angebot", nicht „Fehler"
          content:
            application/json:
              schema:
                type: object
                required: [gerichte, standAlter]
                properties:
                  gerichte:
                    type: array
                    items: { $ref: "#/components/schemas/Gericht" }
                  standAlter: { $ref: "#/components/schemas/StandAlter" }
        "404":
          description: Unbekannte Mensa-Kennung
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Fehler" }
        default: { $ref: "#/components/responses/Fehler" }

  /mensen/verzeichnisse:
    get:
      tags: [mensa]
      summary: Gerichtskategorien und Zusatzstoffverzeichnis
      description: Zwischenspeicher von INT-015, erfüllt API-F-075, MENSA-F-035 und MENSA-F-048.
      security: []
      parameters:
        - $ref: "#/components/parameters/Sprache"
      responses:
        "200":
          description: Schlüsselverzeichnisse
          content:
            application/json:
              schema:
                type: object
                required: [kategorien, zusatzstoffe, kennzeichnungen]
                properties:
                  kategorien:
                    type: array
                    items: { $ref: "#/components/schemas/Schluesselwert" }
                  zusatzstoffe:
                    type: array
                    items: { $ref: "#/components/schemas/Schluesselwert" }
                  kennzeichnungen:
                    type: array
                    description: Ernährungs-/Herkunftsmerkmale (INT-015 `types`), erfüllt MENSA-F-035.
                    items: { $ref: "#/components/schemas/Schluesselwert" }
        default: { $ref: "#/components/responses/Fehler" }

  # ---------------------------------------------------------------------- Raum
  /raeume:
    get:
      tags: [raum]
      summary: Vom FSR gepflegte Raumliste
      description: Erfüllt RAUM-F-100, RAUM-F-110 und RAUM-F-120.
      security: []
      responses:
        "200":
          description: Räume mit Größenklasse und E-Key-Zugänglichkeit
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Raum" }
        default: { $ref: "#/components/responses/Fehler" }

  /raeume/frei:
    get:
      tags: [raum]
      summary: Zu einem Zeitraum freie Räume
      description: |
        Erfüllt RAUM-F-020, RAUM-F-030, RAUM-F-045 und RAUM-F-090. Grundlage ist der
        Zwischenspeicher der Raumtermine aus INT-009 (Platzhalter-Form, API-F-045).
      security: []
      parameters:
        - name: von
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: bis
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: mindestgroesse
          in: query
          required: false
          description: Schränkt auf Räume dieser Größenklasse oder größer ein (RAUM-F-100).
          schema: { $ref: "#/components/schemas/Raumgroesse" }
        - name: nurEkey
          in: query
          required: false
          description: Schränkt auf mit E-Key zugängliche Räume ein (RAUM-F-110).
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Freie Räume; leere Liste ist ein gültiges Ergebnis
          content:
            application/json:
              schema:
                type: object
                required: [raeume, standAlter]
                properties:
                  raeume:
                    type: array
                    items: { $ref: "#/components/schemas/FreierRaum" }
                  standAlter: { $ref: "#/components/schemas/StandAlter" }
        default: { $ref: "#/components/responses/Fehler" }

  /raeume/{roomId}/belegung:
    get:
      tags: [raum]
      summary: Belegung eines einzelnen Raums
      description: Erfüllt RAUM-F-010.
      security: []
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: string, examples: ["A.E.01"] }
        - name: datum
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        "200":
          description: Termine des Raums am gewählten Tag
          content:
            application/json:
              schema:
                type: object
                required: [termine, standAlter]
                properties:
                  termine:
                    type: array
                    items: { $ref: "#/components/schemas/Raumtermin" }
                  standAlter: { $ref: "#/components/schemas/StandAlter" }
        "404":
          description: Raum nicht in der gepflegten Liste (RAUM, Abschnitt 9)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Fehler" }
        default: { $ref: "#/components/responses/Fehler" }

  /raeume/{roomId}/besetzt-meldungen:
    post:
      tags: [raum]
      summary: Raum als besetzt melden
      description: |
        Erfüllt RAUM-F-070 und API-F-210. Kontofrei (IDENT); Missbrauchsschutz über
        Ratenbegrenzung je Quelle (API-N-015) und Mustererkennung (IDENT-F-065).
      security: []
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/IdempotenzSchluessel"
      responses:
        "202":
          description: Meldung entgegengenommen
        "429": { $ref: "#/components/responses/ZuVieleAnfragen" }
        default: { $ref: "#/components/responses/Fehler" }

  /raeume/uebersicht:
    get:
      tags: [raum]
      summary: Alle Räume mit aktueller Belegung
      description: |
        Erfüllt RAUM-F-150 bis RAUM-F-190, RAUM-F-240 bis RAUM-F-260 und API-F-055.
        Grundlage ist der Zwischenspeicher der Raumplan-Termine aus INT-009
        (Platzhalter-Form, API-F-045) — nicht auf die kuratierte Raumliste
        (RAUM-F-120) beschränkt. Die Ansicht laufender Veranstaltungen (RAUM-F-200)
        ist die clientseitig nach Veranstaltung gruppierte Sicht auf diese Antwort.
      security: []
      parameters:
        - name: zeitpunkt
          in: query
          required: false
          description: Bezugszeitpunkt der Belegung; ohne Angabe „jetzt".
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Räume mit Belegungszustand und Stand-Alter
          content:
            application/json:
              schema:
                type: object
                required: [raeume, standAlter]
                properties:
                  raeume:
                    type: array
                    items: { $ref: "#/components/schemas/RaumStatus" }
                  standAlter: { $ref: "#/components/schemas/StandAlter" }
        default: { $ref: "#/components/responses/Fehler" }

  /raumplan/termine:
    get:
      tags: [raum]
      summary: Zwischengespeicherte Raumplan-Termine für den Stundenplan-Abgleich
      description: |
        Erfüllt SCHED-F-410 und API-F-056. Liefert die zwischengespeicherten
        Raumplan-Termine aus INT-009; die App gleicht sie lokal gegen ihren
        ausschließlich gerätegespeicherten Stundenplan ab (SCHED-F-410), sodass
        API-F-100 ohne Ausnahme gewahrt bleibt.
      security: []
      parameters:
        - name: studiengang
          in: query
          required: false
          description: Optionaler Filter auf einen Studiengang-Kurznamen (INT-001).
          schema: { type: string }
      responses:
        "200":
          description: Raumplan-Termine mit Stand-Alter
          content:
            application/json:
              schema:
                type: object
                required: [termine, standAlter]
                properties:
                  termine:
                    type: array
                    items: { $ref: "#/components/schemas/RaumplanTermin" }
                  standAlter: { $ref: "#/components/schemas/StandAlter" }
        default: { $ref: "#/components/responses/Fehler" }

  # ---------------------------------------------------------------------- News
  /meldungen:
    get:
      tags: [news]
      summary: Meldungen, absteigend nach Veröffentlichungszeitpunkt
      description: |
        Erfüllt NEWS-F-010 und NEWS-F-140. Zwischenspeicher von INT-003 (FSR-News) und
        INT-010 (FB-Aktuelles); Event-Erinnerungen werden serverseitig abgeleitet.
      security: []
      parameters:
        - name: klassifizierung
          in: query
          required: false
          description: Schränkt auf eine Klassifizierung ein (NEWS-F-110).
          schema: { $ref: "#/components/schemas/Klassifizierung" }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Seite von Meldungen
          content:
            application/json:
              schema:
                type: object
                required: [meldungen, standAlter]
                properties:
                  meldungen:
                    type: array
                    items: { $ref: "#/components/schemas/Meldung" }
                  naechsterCursor:
                    type: [string, "null"]
                    description: Null, wenn keine älteren Meldungen mehr vorliegen.
                  standAlter: { $ref: "#/components/schemas/StandAlter" }
        default: { $ref: "#/components/responses/Fehler" }

  /meldungen/entwuerfe:
    get:
      tags: [news]
      summary: Meldungsentwürfe der Redaktion
      description: Erfüllt ADMIN-F-040. Erfordert die Rolle FSR-Redaktion (ADMIN-F-010).
      responses:
        "200":
          description: Entwürfe
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Meldungsentwurf" }
        "401": { $ref: "#/components/responses/Unauthentifiziert" }
        "403": { $ref: "#/components/responses/Verboten" }
        default: { $ref: "#/components/responses/Fehler" }
    post:
      tags: [news]
      summary: Meldungsentwurf anlegen
      description: Erfüllt ADMIN-F-040 und API-F-090.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MeldungsentwurfEingabe" }
      responses:
        "201":
          description: Entwurf angelegt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Meldungsentwurf" }
        "401": { $ref: "#/components/responses/Unauthentifiziert" }
        "403": { $ref: "#/components/responses/Verboten" }
        default: { $ref: "#/components/responses/Fehler" }

  /meldungen/entwuerfe/{entwurfId}:
    put:
      tags: [news]
      summary: Meldungsentwurf ändern
      description: |
        Erfüllt ADMIN-F-040. Der Kopf `If-Match` schützt vor dem Überschreiben
        einer zwischenzeitlichen Änderung durch eine andere Person (ADMIN, Abschnitt 9).
      parameters:
        - $ref: "#/components/parameters/EntwurfId"
        - name: If-Match
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MeldungsentwurfEingabe" }
      responses:
        "200":
          description: Entwurf geändert
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Meldungsentwurf" }
        "401": { $ref: "#/components/responses/Unauthentifiziert" }
        "403": { $ref: "#/components/responses/Verboten" }
        "412":
          description: Zwischenzeitlich geändert; neuerer Stand im Rumpf
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Fehler" }
        default: { $ref: "#/components/responses/Fehler" }

  /meldungen/entwuerfe/{entwurfId}/veroeffentlichung:
    put:
      tags: [news]
      summary: Meldung veröffentlichen
      description: Erfüllt ADMIN-F-040.
      parameters:
        - $ref: "#/components/parameters/EntwurfId"
      responses:
        "200":
          description: Veröffentlicht
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Meldung" }
        "401": { $ref: "#/components/responses/Unauthentifiziert" }
        "403": { $ref: "#/components/responses/Verboten" }
        default: { $ref: "#/components/responses/Fehler" }
    delete:
      tags: [news]
      summary: Meldung zurückziehen
      description: |
        Erfüllt ADMIN-F-050. Die Meldung verschwindet aus der Liste; angepinnte
        Verweise darauf werden als zurückgezogen gekennzeichnet.
      parameters:
        - $ref: "#/components/parameters/EntwurfId"
      responses:
        "204":
          description: Zurückgezogen
        "401": { $ref: "#/components/responses/Unauthentifiziert" }
        "403": { $ref: "#/components/responses/Verboten" }
        default: { $ref: "#/components/responses/Fehler" }

  # -------------------------------------------------------------- Stundenplan
  /stundenplan/studiengaenge:
    get:
      tags: [stundenplan]
      summary: Rückfallliste der Studiengänge
      description: |
        Erfüllt API-F-240 und SCHED-F-254. Wird nur verwendet, wenn INT-001 nicht
        erreichbar ist; im Regelfall spricht die App INT-001 unmittelbar an (ARCH-F-020).
      security: []
      responses:
        "200":
          description: Studiengänge mit Fachsemestern
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Studiengang" }
        default: { $ref: "#/components/responses/Fehler" }

  /stundenplan/pruefungsplan/stand:
    get:
      tags: [stundenplan]
      summary: Zeitpunkt der letzten Prüfungsplan-Änderung
      description: |
        Erfüllt API-F-205. Liefert ausschließlich einen Zeitstempel — die App gleicht
        ihn gegen ihre ausschließlich lokal gespeicherte Auswahl ab (SCHED-F-220),
        sodass API-F-100 ohne Ausnahme gewahrt bleibt.
      security: []
      responses:
        "200":
          description: Änderungszeitpunkt
          content:
            application/json:
              schema:
                type: object
                required: [geaendertAm]
                properties:
                  geaendertAm:
                    type: [string, "null"]
                    format: date-time
        default: { $ref: "#/components/responses/Fehler" }

  # ----------------------------------------------------------------- Bewertung
  /gerichte/{gerichtSchluessel}/bewertungen:
    get:
      tags: [bewertung]
      summary: Bewertungen eines Gerichts
      description: |
        Erfüllt RATE-F-030 und RATE-F-080. Lesen ist kontofrei (IDENT-F-012, RATE-F-090).
        `gerichtSchluessel` ist die normalisierte Gerichtsbezeichnung (RATE-F-050).
      security: []
      parameters:
        - $ref: "#/components/parameters/GerichtSchluessel"
      responses:
        "200":
          description: Gesamt- und Tagesbewertung
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bewertungsuebersicht" }
        default: { $ref: "#/components/responses/Fehler" }
    post:
      tags: [bewertung]
      summary: Bewertung abgeben
      description: |
        Erfüllt RATE-F-010 und API-F-010. Erfordert ein Konto (IDENT-F-015, RATE-F-090).
        Der Idempotenz-Schlüssel sichert die Offline-Warteschlange ab (API-F-140).
        Freitext-Kommentare (RATE-F-020) folgen in der zweiten Ausbaustufe.
      parameters:
        - $ref: "#/components/parameters/GerichtSchluessel"
        - $ref: "#/components/parameters/IdempotenzSchluessel"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sterne]
              properties:
                sterne: { type: integer, minimum: 1, maximum: 5 }
      responses:
        "201":
          description: Bewertung gespeichert
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bewertung" }
        "200":
          description: Bereits mit diesem Idempotenz-Schlüssel verarbeitet (API-F-140)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bewertung" }
        "409":
          description: Bereits heute für dieses Gericht bewertet (RATE-F-040, IDENT-F-050)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Fehler" }
        "429": { $ref: "#/components/responses/ZuVieleAnfragen" }
        default: { $ref: "#/components/responses/Fehler" }

  /bewertungen/{bewertungId}:
    delete:
      tags: [bewertung]
      summary: Eigene Bewertung löschen
      description: Erfüllt RATE-F-070.
      parameters:
        - name: bewertungId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Gelöscht }
        "401": { $ref: "#/components/responses/Unauthentifiziert" }
        "403": { $ref: "#/components/responses/Verboten" }
        default: { $ref: "#/components/responses/Fehler" }

  # ---------------------------------------------------------------- Verwaltung
  /verwaltung/rollen:
    get:
      tags: [verwaltung]
      summary: Konten mit Verwaltungsrollen
      description: |
        Erfüllt ADMIN-F-070 und IDENT-F-045. Führendes System ist Authentik (INT-012);
        das Backend hält keine eigene Rollentabelle (API-F-250).
      responses:
        "200":
          description: Rollenzuweisungen
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Rollenzuweisung" }
        "401": { $ref: "#/components/responses/Unauthentifiziert" }
        "403": { $ref: "#/components/responses/Verboten" }
        default: { $ref: "#/components/responses/Fehler" }
    put:
      tags: [verwaltung]
      summary: Rollen eines Kontos setzen
      description: |
        Erfüllt ADMIN-F-070. Wirkt auf Authentik-Gruppen. `kontoId` darf ein
        Benutzername sein; das Backend löst ihn zur stabilen Konto-Id auf (INT-012)
        und gibt sie in der Antwort zurück. Der Versuch, die letzte verbleibende
        Zuweisung der Rolle FSR-Redaktion zu entziehen, wird abgelehnt (ADMIN-F-080).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Rollenzuweisung" }
      responses:
        "200":
          description: Rollen gesetzt; `kontoId` ist die aufgelöste Konto-Id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rollenzuweisung" }
        "401": { $ref: "#/components/responses/Unauthentifiziert" }
        "403": { $ref: "#/components/responses/Verboten" }
        "404":
          description: Kein Konto mit dem angegebenen Benutzernamen (ADMIN-F-070)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Fehler" }
        "409":
          description: Letzte Zuweisung der Rolle FSR-Redaktion (ADMIN-F-080)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Fehler" }
        default: { $ref: "#/components/responses/Fehler" }

  /verwaltung/laufwege:
    get:
      tags: [verwaltung]
      summary: Laufwege zwischen Räumen
      description: |
        Erfüllt API-F-220 und ADMIN-F-090; Grundlage für RAUM-F-060. Der Kopf `ETag`
        trägt den Stand der Gesamtliste für die optimistische Nebenläufigkeitskontrolle
        beim Ersetzen (siehe PUT unten).
      responses:
        "200":
          description: Laufwege
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Laufweg" }
        "401": { $ref: "#/components/responses/Unauthentifiziert" }
        "403": { $ref: "#/components/responses/Verboten" }
        default: { $ref: "#/components/responses/Fehler" }
    put:
      tags: [verwaltung]
      summary: Laufwege ersetzen
      description: |
        Erfüllt ADMIN-F-090. Einträge mit unbekannter Raumkennung werden gespeichert
        und im Ergebnis als unbekannt gekennzeichnet (ADMIN-F-100). Der Kopf `If-Match`
        schützt vor dem Überschreiben einer zwischenzeitlichen Änderung durch eine
        andere Person, analog `/meldungen/entwuerfe/{entwurfId}`.
      parameters:
        - name: If-Match
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/Laufweg" }
      responses:
        "200":
          description: Laufwege gesetzt, mit Hinweisen auf unbekannte Raumkennungen
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [laufwege, unbekannteRaeume]
                properties:
                  laufwege:
                    type: array
                    items: { $ref: "#/components/schemas/Laufweg" }
                  unbekannteRaeume:
                    type: array
                    items: { type: string }
        "400":
          description: Eintrag ohne Raumkennung oder Weg auf dieselbe Kennung (ADMIN Abschnitt 9)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Fehler" }
        "401": { $ref: "#/components/responses/Unauthentifiziert" }
        "403": { $ref: "#/components/responses/Verboten" }
        "412":
          description: Zwischenzeitlich geändert; neuerer Stand über GET erneut abrufen
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Fehler" }
        default: { $ref: "#/components/responses/Fehler" }

  /verwaltung/stammdaten:
    get:
      tags: [verwaltung]
      summary: Ferngepflegte Stammdaten zur Bearbeitung
      description: |
        Erfüllt ADMIN-F-180 und ADMIN-F-190. Liefert denselben Bestand wie
        `GET /stammdaten`, hier jedoch nur für die Rolle FSR-Redaktion und mit
        `ETag` für die optimistische Nebenläufigkeitskontrolle beim Ersetzen.
      responses:
        "200":
          description: Aktueller Stammdatenbestand
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stammdaten" }
        "401": { $ref: "#/components/responses/Unauthentifiziert" }
        "403": { $ref: "#/components/responses/Verboten" }
        default: { $ref: "#/components/responses/Fehler" }
    put:
      tags: [verwaltung]
      summary: Stammdaten ersetzen
      description: |
        Erfüllt ADMIN-F-180, ADMIN-F-190 und ADMIN-F-200. Ersetzt den gesamten
        Bestand (Mensa-Liste, Raumliste, Links, Semestertermine, Ticket-Bildausschnitt).
        Der Kopf `If-Match` schützt vor dem Überschreiben einer zwischenzeitlichen
        Änderung durch eine andere Person.
      parameters:
        - name: If-Match
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Stammdaten" }
      responses:
        "200":
          description: Stammdaten gesetzt
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stammdaten" }
        "400":
          description: Leere oder doppelte Mensa-/Raumkennung (ADMIN Abschnitt 9)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Fehler" }
        "401": { $ref: "#/components/responses/Unauthentifiziert" }
        "403": { $ref: "#/components/responses/Verboten" }
        "412":
          description: Zwischenzeitlich geändert; neuerer Stand über GET erneut abrufen (ADMIN-F-200)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Fehler" }
        default: { $ref: "#/components/responses/Fehler" }

components:
  securitySchemes:
    authentik:
      type: openIdConnect
      openIdConnectUrl: https://auth.fsrfb4.de/application/o/fb4-app/.well-known/openid-configuration
      description: |
        OpenID Connect gegen die eigenbetriebene Authentik-Instanz (INT-012).
        Rollen kommen als Gruppen-Claim; das Backend wertet sie aus (API-F-250).
        Siehe decisions/0010-authentik-als-identitaetsanbieter.md.

  parameters:
    MensaId:
      name: mensaId
      in: path
      required: true
      schema: { type: string }
    Datum:
      name: datum
      in: path
      required: true
      schema: { type: string, format: date }
    Sprache:
      name: Accept-Language
      in: header
      required: false
      description: Steuert die Sprache von Bezeichnungen, sofern die Quelle sie liefert (MENSA-F-048, NFR-F-115).
      schema: { type: string, enum: [de, en], default: de }
    GerichtSchluessel:
      name: gerichtSchluessel
      in: path
      required: true
      description: Normalisierte Gerichtsbezeichnung nach RATE-F-050.
      schema: { type: string }
    EntwurfId:
      name: entwurfId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotenzSchluessel:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Clientseitig erzeugte Kennung je Vorgang. Sichert ab, dass ein aus der
        Offline-Warteschlange erneut gesendeter Schreibvorgang nicht doppelt
        wirksam wird (API-F-140, ARCH-F-120).
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }

  responses:
    Fehler:
      description: Fehler in einheitlichem Format (API-N-040)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Fehler" }
    Unauthentifiziert:
      description: Fehlende oder ungültige Authentifizierung
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Fehler" }
    Verboten:
      description: Rolle fehlt (ADMIN-F-010)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Fehler" }
    ZuVieleAnfragen:
      description: Ratenbegrenzung greift (API-N-010, API-N-015)
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Fehler" }

  schemas:
    Fehler:
      type: object
      description: Einheitliches Fehlerformat nach RFC 9457, erfüllt API-N-040.
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string, description: Für Menschen lesbare Meldung }
        status: { type: integer }
        code: { type: string, description: Maschinenlesbarer Fehlercode }
        detail: { type: string }

    StandAlter:
      type: object
      description: |
        Alter des ausgelieferten Zwischenspeicher-Stands. Die App weist es aus,
        wenn Daten nicht mehr taufrisch sind (DATA-F-090, RAUM Abschnitt 9).
      required: [abgerufenAm]
      properties:
        abgerufenAm: { type: string, format: date-time }
        quelleErreichbar: { type: boolean, default: true }

    Stammdaten:
      type: object
      description: Erfüllt API-F-230.
      required: [mensen, raeume, links, semestertermine]
      properties:
        mensen:
          type: array
          items: { $ref: "#/components/schemas/Mensa" }
        raeume:
          type: array
          items: { $ref: "#/components/schemas/Raum" }
        links:
          type: array
          items: { $ref: "#/components/schemas/Link" }
        semestertermine: { $ref: "#/components/schemas/Semestertermine" }
        ticketBildausschnitt:
          $ref: "#/components/schemas/Bildausschnitt"

    Mensa:
      type: object
      required: [id, name, standardAuswahl, reihenfolge]
      properties:
        id: { type: string }
        name: { type: string }
        quelleId:
          type: string
          description: Kennung im Quellsystem INT-015.
        standardAuswahl: { type: boolean }
        reihenfolge: { type: integer }
        speiseplanUrl: { type: string, format: uri }
        oeffnungszeiten:
          type: array
          description: Ein Eintrag je Wochentag, Montag zuerst (MENSA-F-047).
          items:
            type: [string, "null"]

    Gericht:
      type: object
      required: [schluessel, kategorie, bezeichnung]
      properties:
        schluessel:
          type: string
          description: Normalisierte Bezeichnung nach RATE-F-050; Bindeglied zu Bewertungen und Lieblingsgerichten (MENSA-F-090).
        kategorie:
          type: string
          description: Anzeigekategorie in der über Accept-Language gewählten Sprache (INT-015 `counterNames`); `Beilagen` wird von der App abgesetzt dargestellt (MENSA-F-040).
        bezeichnung:
          type: string
          description: Gerichtsbezeichnung in der gewählten Sprache (INT-015 `title`), ohne die inline stehenden Zusatzstoff-Codes.
        preisStudierende:
          type: [number, "null"]
          description: Preis in Euro. Das Backend parst den INT-015-String (`"3,30 €"`); nicht parsebar → null.
        preisMitarbeitende: { type: [number, "null"] }
        preisGaeste: { type: [number, "null"] }
        zusatzstoffe:
          type: array
          description: Zusatzstoff-/Allergenhinweise in der gewählten Sprache (INT-015 `additives`, über das Verzeichnis aufgelöst).
          items: { type: string }
        kennzeichnungen:
          type: array
          description: Ernährungs-/Herkunftsmerkmale in der gewählten Sprache (INT-015 `type`), erfüllt MENSA-F-035. Leer, wenn die Quelle keine liefert.
          items: { type: string }

    Schluesselwert:
      type: object
      required: [id, bezeichnung]
      properties:
        id: { type: string }
        bezeichnung: { type: string }

    Raumgroesse:
      type: string
      enum: [klein, mittel, gross]

    Raum:
      type: object
      required: [roomId, groesse, ekeyZugaenglich]
      properties:
        roomId: { type: string }
        groesse: { $ref: "#/components/schemas/Raumgroesse" }
        ekeyZugaenglich: { type: boolean }
        schliesszeit:
          type: [string, "null"]
          description: Gebäudeschließzeit als Endzeitpunkt, wenn kein Termin folgt (RAUM-F-130).

    FreierRaum:
      allOf:
        - $ref: "#/components/schemas/Raum"
        - type: object
          required: [freiBis, besetztMeldungen]
          properties:
            freiBis:
              type: string
              format: date-time
              description: Erfüllt RAUM-F-090.
            besetztMeldungen:
              type: integer
              description: Anzahl im gültigen Zeitfenster (RAUM-F-080).

    Raumtermin:
      type: object
      required: [roomId, beginn, ende]
      properties:
        roomId: { type: string }
        beginn: { type: string, format: date-time }
        ende: { type: string, format: date-time }
        bezeichnung: { type: string }
        art:
          type: string
          enum: [lehrveranstaltung, pruefung, sonstiges]
          description: Beide Arten machen den Raum belegt (RAUM-F-030).
        note:
          type: [string, "null"]
          description: Freitext aus INT-009, sofern gesetzt (RAUM-F-220).

    RaumStatus:
      type: object
      description: >
        Belegungszustand eines Raums zum Abfragezeitpunkt (RAUM-F-150 bis RAUM-F-190).
        groesse und ekeyZugaenglich sind nur bei Räumen der kuratierten Liste
        (RAUM-F-120) gesetzt; aktuellerTermin bei zustand = belegt,
        naechsterTermin bei zustand = frei.
      required: [roomId, zustand, besetztMeldungen]
      properties:
        roomId: { type: string }
        zustand:
          type: string
          enum: [frei, belegt]
        groesse: { $ref: "#/components/schemas/Raumgroesse" }
        ekeyZugaenglich: { type: boolean }
        aktuellerTermin: { $ref: "#/components/schemas/Raumtermin" }
        naechsterTermin: { $ref: "#/components/schemas/Raumtermin" }
        besetztMeldungen:
          type: integer
          description: Anzahl gültiger „besetzt"-Meldungen (RAUM-F-190).

    RaumplanTermin:
      type: object
      description: >
        Ein zwischengespeicherter Raumplan-Termin aus INT-009, reduziert auf die
        für den lokalen Stundenplan-Abgleich nötigen Felder (SCHED-F-410).
      required: [roomId, wochentag, beginn, ende, bezeichnung]
      properties:
        roomId: { type: string }
        wochentag:
          type: string
          enum: [Mon, Tue, Wed, Thu, Fri]
        beginn: { type: string, description: "HHmm, linksseitig auf vier Stellen aufgefüllt" }
        ende: { type: string, description: "HHmm, linksseitig auf vier Stellen aufgefüllt" }
        bezeichnung: { type: string }
        studentSet: { type: [string, "null"] }
        lecturerId: { type: [string, "null"] }
        note: { type: [string, "null"] }

    Klassifizierung:
      type: string
      enum: [fsr-news, fb-aktuelles, event-erinnerung]
      description: Erfüllt NEWS-F-080.

    Meldung:
      type: object
      required: [id, titel, text, veroeffentlichtAm, klassifizierung]
      properties:
        id: { type: string, format: uuid }
        titel: { type: string }
        text: { type: string }
        veroeffentlichtAm:
          type: [string, "null"]
          format: date-time
          description: Null, wenn der Zeitstempel unlesbar war (NEWS, Abschnitt 9).
        klassifizierung: { $ref: "#/components/schemas/Klassifizierung" }
        quelle: { type: string }
        zurueckgezogen:
          type: boolean
          default: false
          description: Erfüllt ADMIN-F-050.

    MeldungsentwurfEingabe:
      type: object
      required: [titel, text]
      properties:
        titel: { type: string }
        text: { type: string }
        geplanteVeroeffentlichung:
          type: [string, "null"]
          format: date-time

    Meldungsentwurf:
      allOf:
        - $ref: "#/components/schemas/MeldungsentwurfEingabe"
        - type: object
          required: [id, zustand, etag]
          properties:
            id: { type: string, format: uuid }
            zustand:
              type: string
              enum: [entwurf, veroeffentlicht, zurueckgezogen]
            etag:
              type: string
              description: Für If-Match beim Ändern (ADMIN, Abschnitt 9).

    Studiengang:
      type: object
      required: [kurzname, name, fachsemester]
      properties:
        kurzname: { type: string }
        name: { type: string }
        fachsemester:
          type: array
          items: { type: integer }

    Bewertungsuebersicht:
      type: object
      required: [gerichtSchluessel, gesamt, heute]
      properties:
        gerichtSchluessel: { type: string }
        gesamt: { $ref: "#/components/schemas/Bewertungsmittel" }
        heute:
          oneOf:
            - $ref: "#/components/schemas/Bewertungsmittel"
            - type: "null"
          description: Null, wenn heute noch keine Bewertung vorliegt (RATE, Abschnitt 9).

    Bewertungsmittel:
      type: object
      required: [durchschnitt, anzahl]
      properties:
        durchschnitt: { type: number }
        anzahl: { type: integer }

    Bewertung:
      type: object
      required: [id, gerichtSchluessel, sterne, abgegebenAm]
      properties:
        id: { type: string, format: uuid }
        gerichtSchluessel: { type: string }
        sterne: { type: integer, minimum: 1, maximum: 5 }
        abgegebenAm: { type: string, format: date-time }
        anzeigename:
          type: string
          description: Vom Konto entkoppelbares Pseudonym (IDENT-F-120).

    Rolle:
      type: string
      enum: [fsr-redaktion, moderation]

    Rollenzuweisung:
      type: object
      required: [kontoId, rollen]
      properties:
        kontoId:
          type: string
          description: >
            Stabile Authentik-Konto-Id. Beim Schreiben (PUT /verwaltung/rollen)
            auch als Benutzername zulässig; das Backend löst ihn auf und gibt die
            Id zurück (ADMIN-F-070).
        anzeigename: { type: string }
        rollen:
          type: array
          items: { $ref: "#/components/schemas/Rolle" }

    Laufweg:
      type: object
      required: [vonRoomId, nachRoomId, gewicht]
      properties:
        vonRoomId: { type: string }
        nachRoomId: { type: string }
        gewicht:
          type: number
          description: Fußweg in Minuten (RAUM, Abschnitt 13).

    Link:
      type: object
      required: [bezeichnung, url]
      properties:
        bezeichnung: { type: string }
        url: { type: string, format: uri }
        gruppe: { type: string }
        reihenfolge: { type: integer }

    Semestertermine:
      type: object
      properties:
        semesterBeginn: { type: string, format: date }
        semesterEnde: { type: string, format: date }
        naechsterWinterSemesterBeginn: { type: string, format: date }
        naechsterSommerSemesterBeginn: { type: string, format: date }

    Bildausschnitt:
      type: object
      description: Zuschnitt für die Ticketanzeige (TICKET-F-080).
      required: [links, oben, rechts, unten]
      properties:
        links: { type: integer }
        oben: { type: integer }
        rechts: { type: integer }
        unten: { type: integer }
