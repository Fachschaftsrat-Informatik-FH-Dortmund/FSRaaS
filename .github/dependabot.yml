version: 2

# Alerts und automatische Update-Pull-Requests für bekannte Schwachstellen
# (QA-N-120). Ausschließlich GitHub-native Bausteine (quality-and-testing.md
# Abschnitt 10).

updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /tools/spec-check
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /tools/contract-codegen
    schedule:
      interval: weekly

  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
