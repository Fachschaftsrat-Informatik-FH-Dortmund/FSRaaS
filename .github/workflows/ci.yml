name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Prüfungen am Anforderungsbestand (openspec/specs/quality-and-testing,
  # Abschnitt „Prüfungen am Anforderungsbestand selbst"). Ein Verstoß blockiert
  # den Merge.
  spec-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: node tools/spec-check/src/cli.js
      - run: node --test tools/spec-check/test/
      # Struktur von Proposal, Spec-Delta, Design und Tasks (ADR 0019).
      # Bewusst ohne --strict: die Strict-Stufe verlangt die englischen
      # RFC-2119-Wörter SHALL/MUST und meldet damit jedes deutsche „muss"
      # als Verstoß (openspec 1.12). Fehler der Stufe ERROR blockieren auch
      # ohne --strict.
      # Paketname ist @fission-ai/openspec; das npm-Paket „openspec" ist ein
      # unbeteiligter Platzhalter (0.0.0). Version fest, damit eine neue
      # Prüfregel nicht unangekündigt die CI bricht.
      - run: npx --yes @fission-ai/openspec@1.12.0 validate --specs

  # Keine Verhaltensänderung ohne Spec-Delta im selben Merge (NFR-N-140,
  # README.md Abschnitt 7): eine PR ändert etwas unter openspec/ oder specs/
  # ODER trägt das Label spec-unchanged. Seit ADR 0019 liegt der fachliche
  # Bestand unter openspec/, die Entscheidungen und Produktdokumente unter
  # specs/ — beide Bäume zählen.
  spec-delta:
    # Dependabot ausgenommen: Eine Abhängigkeitsaktualisierung ändert kein
    # Verhalten der App und kann kein Spec-Delta tragen. Ohne diese Ausnahme
    # steht jede Dependabot-PR dauerhaft rot, und das Label spec-unchanged
    # müsste jedes Mal von Hand gesetzt werden.
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: openspec/ oder specs/ geändert oder Label spec-unchanged gesetzt?
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if echo ",$LABELS," | grep -q ",spec-unchanged,"; then
            echo "Label spec-unchanged gesetzt — Spec-Delta nicht erforderlich."
            exit 0
          fi
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -qE '^(openspec|specs)/'; then
            echo "openspec/ oder specs/ geändert — Spec-anchored Merge-Regel erfüllt."
            exit 0
          fi
          echo "::error::Weder eine Änderung unter openspec/ oder specs/ noch das Label spec-unchanged. Siehe README.md Abschnitt 7."
          exit 1

  # Typen werden aus dem Vertrag erzeugt, nicht von Hand geschrieben (API-N-035).
  contract-codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - working-directory: tools/contract-codegen
        run: |
          npm ci
          npm test

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # Vertragstypen aus api-contract.yaml erzeugen (API-N-035); die Zieldatei
      # app/src/api/generated/schema.ts ist gitignored und entsteht hier neu.
      - name: contract types
        working-directory: .
        run: |
          npm --prefix tools/contract-codegen ci
          node tools/contract-codegen/src/generate.mjs
      # QA-F-130: Abhängigkeiten mit bekannter Schwachstelle ab hoch blockieren den
      # Merge. Die datierte Allowlist in app/audit-ci.jsonc enthält nur den
      # triagierten Bestand der Expo-Build-Werkzeugkette (quality-and-testing.md
      # Abschnitt 10); jede darüber hinausgehende Schwachstelle bricht die CI.
      - run: npx audit-ci --config audit-ci.jsonc
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci

  # Web-Export der Verwaltungsoberfläche (ADR 0018). Wird vom Backend unter /admin
  # mitausgeliefert; hier nur der reproduzierbare Bau als Artefakt.
  admin-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: contract types
        working-directory: .
        run: |
          npm --prefix tools/contract-codegen ci
          node tools/contract-codegen/src/generate.mjs
      - run: npx expo export --platform web --output-dir dist-web
      - uses: actions/upload-artifact@v4
        with:
          name: admin-web
          path: app/dist-web

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      # Vertragstypen erzeugen (API-N-035); backend/src/Fb4.Backend/Contract/Generated/
      # ist gitignored und entsteht hier neu, vor dem Build.
      - name: contract types
        working-directory: .
        run: |
          npm --prefix tools/contract-codegen ci
          node tools/contract-codegen/src/generate.mjs
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release
      # NuGet-Abhängigkeiten mit bekannter Schwachstelle blockieren den Merge (QA-F-130).
      - name: dotnet list package --vulnerable
        run: |
          output="$(dotnet list package --vulnerable --include-transitive 2>&1)"
          echo "$output"
          if echo "$output" | grep -qiE '\b(High|Critical)\b'; then
            echo "::error::Abhängigkeit mit Schwachstelle ab Schweregrad hoch."
            exit 1
          fi
