name: TEMP SSH-Debug (loeschen nach Diagnose)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: SSH-Testskript
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          debug: true
          script_stop: true
          script: |
            echo "SSH-Verbindung ok: whoami=$(whoami) pwd=$(pwd)"
            NEW_VERSION_CODE=1
            REMOTE_FILE=/var/www/fsrfb4aas-downloads/app-latest.versioncode
            ls -la /var/www/fsrfb4aas-downloads/ || echo "Verzeichnis-Listing fehlgeschlagen"
            if [ -f "$REMOTE_FILE" ]; then
              CURRENT_VERSION_CODE=$(cat "$REMOTE_FILE")
            else
              CURRENT_VERSION_CODE=0
            fi
            echo "Bisheriger versionCode: $CURRENT_VERSION_CODE, neuer versionCode: $NEW_VERSION_CODE"
            if [ "$NEW_VERSION_CODE" -le "$CURRENT_VERSION_CODE" ]; then
              echo "versionCode $NEW_VERSION_CODE ist nicht strikt groesser als der zuletzt veroeffentlichte $CURRENT_VERSION_CODE." >&2
              exit 1
            fi
            echo "Alles gut."
