name: TEMP SSH-Debug (loeschen nach Diagnose)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: SSH-Testskript
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          debug: true
          script_stop: true
          script: |
            echo "checkpoint 1: vor if"
            X=/pfad/den/es/nicht/gibt
            if [ -f "$X" ]; then
              echo "checkpoint 2: then-zweig"
            else
              echo "checkpoint 3: else-zweig"
            fi
            echo "checkpoint 4: nach if"
