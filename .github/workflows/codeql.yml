name: CodeQL

# Statische Sicherheitsanalyse (SAST, QA-N-140). Ergebnisse als PR-Check.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, csharp]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          # Schlüssel heißt „languages", nicht „language". Mit dem falschen
          # Namen verwirft die Action die Eingabe kommentarlos (nur eine
          # Warnung im Protokoll), erkennt alle Sprachen selbst — darunter
          # Swift — und bricht ab: „Swift analysis is only supported on macOS
          # runner images."
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
