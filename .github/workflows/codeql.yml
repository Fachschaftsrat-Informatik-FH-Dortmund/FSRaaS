name: CodeQL

# Statische Sicherheitsanalyse (SAST, QA-N-140). Ergebnisse als PR-Check.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read
  security-events: write
  # CodeQL liest Angaben zum Workflow-Lauf; ohne dieses Recht bricht init@v3 mit
  # „Resource not accessible by integration" ab.
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, csharp]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Vertragstypen erzeugen (API-N-035). backend/src/Fb4.Backend/Contract/Generated/
      # steht in .gitignore und entsteht erst hier; ohne diesen Schritt scheitert
      # der C#-Autobuild an fehlenden Typen (CS0234 „Fb4.Backend.Contract").
      - name: contract types
        if: matrix.language == 'csharp'
        run: |
          npm --prefix tools/contract-codegen ci
          node tools/contract-codegen/src/generate.mjs
      - uses: github/codeql-action/init@v3
        with:
          # Schlüssel heißt „languages", nicht „language". Mit dem falschen
          # Namen verwirft die Action die Eingabe kommentarlos (nur eine
          # Warnung im Protokoll), erkennt alle Sprachen selbst — darunter
          # Swift — und bricht ab: „Swift analysis is only supported on macOS
          # runner images."
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
